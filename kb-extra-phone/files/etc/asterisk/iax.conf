[general]
bandwidth=high
; codecs
disallow=all
allow=ulaw,alaw

; Jitter buffer
jitterbuffer=no

; Encryption options
encryption=no

; Autokill?
autokill=yes

; Guest sections for unauthenticated connection attempts.  Just specify an
; empty secret, or provide no secret section.
[guest]
type=user
context=public
callerid="Guest IAX User"

[phone]
type=friend
host=172.23.42.10
description=phone iax peer            ; Description of this peer, as listed by
qualify=yes                ; Make sure this peer is alive.
context=from-phone
peercontext=from_kiezbox
